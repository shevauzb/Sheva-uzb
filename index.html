<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheva ovozi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
:root{--bg:#eef3f6;--ink:#14213d;--mute:#5b6b82;--card:#fff;--line:#d3dde6;--acc:#0e8f9b;--acc-ink:#fff;--gold:#e9a63a;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a2b;--ink:#e8eef6;--mute:#93a4bb;--card:#182740;--line:#2a3d5c;--acc:#2bb8c4;--acc-ink:#062a2e;--gold:#f0b95a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:16px 14px 110px}
h1{font:700 26px/1.15 Literata,Georgia,serif;margin:4px 0 14px}
h2{font:500 15px Literata,Georgia,serif;color:var(--mute);margin:20px 0 8px}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;cursor:pointer}
.chip b{display:block;font-weight:600}
.chip small{display:block;color:var(--mute);font-size:12px;line-height:1.25;margin-top:2px}
.chip.hist{border-left:5px solid var(--gold)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip[aria-pressed=true] small{color:inherit;opacity:.85}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg{display:flex;gap:8px}.seg .chip{flex:1;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#go{width:100%;border:0;border-radius:12px;padding:14px;background:var(--acc);color:var(--acc-ink);font:600 17px system-ui;cursor:pointer}
#go:disabled{opacity:.55}
#out{margin-top:18px}
#out audio{width:100%}
#out p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 0;white-space:pre-wrap}
#msg{color:var(--err);margin-top:10px}
@media (prefers-reduced-motion:no-preference){#go{transition:opacity .2s}}
</style>
</head>
<body>
<h1>Sheva va tarixiy uslub ovozi</h1>
<textarea id="text" maxlength="1500" placeholder="Matnni shu yerga yozing…"></textarea>
<h2>Viloyat shevasi</h2><div class="grid" id="vil"></div>
<h2>Tarixiy uslub</h2><div class="grid" id="tar"></div>
<h2>Ovoz</h2>
<div class="seg" id="voice">
  <button class="chip" data-v="f" aria-pressed="true">Ayol (Madina)</button>
  <button class="chip" data-v="m" aria-pressed="false">Erkak (Sardor)</button>
</div>
<div id="msg" role="alert"></div>
<div id="out" hidden><audio id="player" controls></audio><p id="conv"></p></div>
<div class="bar"><button id="go">Ovozga aylantirish</button></div>
<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
let style = "toshkent", voice = "f";
const $ = id => document.getElementById(id);
function pick(container, attr, set){
  container.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  set.setAttribute("aria-pressed", "true");
}
fetch("/api/styles").then(r => r.json()).then(list => {
  for (const s of list){
    const b = document.createElement("button");
    b.className = "chip" + (s.kind === "tarixiy" ? " hist" : "");
    b.dataset.k = s.key;
    b.innerHTML = `<b>${s.name}</b><small>${s.hint}</small>`;
    b.setAttribute("aria-pressed", s.key === style);
    b.onclick = () => {
      document.querySelectorAll("[data-k]").forEach(c => c.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true"); style = s.key;
    };
    (s.kind === "tarixiy" ? $("tar") : $("vil")).appendChild(b);
  }
});
$("voice").onclick = e => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  pick($("voice"), "v", b); voice = b.dataset.v;
};
$("go").onclick = async () => {
  const text = $("text").value.trim(); $("msg").textContent = "";
  if (!text){ $("msg").textContent = "Avval matn yozing."; return; }
  $("go").disabled = true; $("go").textContent = "Tayyorlanmoqda…";
  try{
    const r = await fetch("/api/tts", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text, style, voice, initData: tg?.initData || ""})});
    if (!r.ok){ const e = await r.json().catch(() => ({})); throw new Error(e.detail || "Xatolik"); }
    const d = await r.json();
    $("player").src = "data:audio/mpeg;base64," + d.audio;
    $("conv").textContent = d.text; $("out").hidden = false;
    $("player").play().catch(() => {});
  }catch(e){ $("msg").textContent = e.message; }
  $("go").disabled = false; $("go").textContent = "Ovozga aylantirish";
};
</script>
</body>
</html>
